services:
  suno-service:
    image: brainless-suno-service
    build:
      context: ./suno-service
      dockerfile: Dockerfile
    environment:
      SUNO_SERVICE_HOST: 0.0.0.0
      SUNO_SERVICE_PORT: 8005
      SUNO_SERVICE_PUBLIC_BASE_URL: ${SUNO_SERVICE_PUBLIC_BASE_URL:-http://127.0.0.1:8005}
      SUNO_LLM_API_URL: ${SUNO_LLM_API_URL:?SUNO_LLM_API_URL is required}
      SUNO_LLM_MODEL_ID: ${SUNO_LLM_MODEL_ID:-gemma-4-31b-it}
      SUNO_TEMPLATE_DIR: /app/templates
      SUNO_GUIDE_HOT_RELOAD: ${SUNO_GUIDE_HOT_RELOAD:-false}
      PORT_PROJECT_INTERNAL_TOKEN: ${PORT_PROJECT_INTERNAL_TOKEN:?PORT_PROJECT_INTERNAL_TOKEN is required}
    ports:
      - "${SUNO_SERVICE_PORT:-8005}:8005"
    volumes:
      - ./suno-service/templates:/app/templates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainless

  speaki-service:
    image: brainless-speaki-service
    build:
      context: ./speaki-service
      dockerfile: Dockerfile
    environment:
      SPEAKI_SERVICE_HOST: 0.0.0.0
      SPEAKI_SERVICE_PORT: 8006
      SPEAKI_SERVICE_PUBLIC_BASE_URL: ${SPEAKI_SERVICE_PUBLIC_BASE_URL:-http://127.0.0.1:8006}
      PORT_PROJECT_INTERNAL_TOKEN: ${PORT_PROJECT_INTERNAL_TOKEN:?PORT_PROJECT_INTERNAL_TOKEN is required}
    ports:
      - "${SPEAKI_SERVICE_PORT:-8006}:8006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainless

  judge-service:
    image: brainless-judge-service
    build:
      context: ./judge-service
      dockerfile: Dockerfile
    environment:
      JUDGE_HOST: 0.0.0.0
      JUDGE_PORT: 8010
      GEMMA_API_URL: ${GEMMA_API_URL:?GEMMA_API_URL is required}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma-4-31b-it}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
      GEMMA_TIMEOUT_SECONDS: ${GEMMA_TIMEOUT_SECONDS:-30}
      PORT_PROJECT_INTERNAL_TOKEN: ${PORT_PROJECT_INTERNAL_TOKEN:?PORT_PROJECT_INTERNAL_TOKEN is required}
      JUDGE_ALLOWED_EMAILS: ${JUDGE_ALLOWED_EMAILS:-elise@local.dev,sock@gmail.com}
      JUDGE_ALLOWED_NAMES: ${JUDGE_ALLOWED_NAMES:-elise,Sock}
      JUDGE_ALLOWED_USER_IDS: ${JUDGE_ALLOWED_USER_IDS:-}
    ports:
      - "${JUDGE_SERVICE_PORT:-8010}:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brainless

networks:
  brainless:
    name: brainless
