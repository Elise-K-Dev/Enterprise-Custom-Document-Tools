[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suno-service"
version = "0.1.0"
description = "Suno V5/V5.5 lyrics and style prompt generation tool service for Open WebUI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0"
]

[tool.setuptools]
packages = ["app"]
