[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-service"
version = "0.1.0"
description = "Web fetch and search tool service for Open WebUI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0",
  "trafilatura>=1.12,<2.0",
  "playwright>=1.44,<2.0",
  "beautifulsoup4>=4.12,<5.0"
]

[tool.setuptools]
packages = ["app"]
